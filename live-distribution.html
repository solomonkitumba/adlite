<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Distribution Network — AdLite</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="imgs/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="imgs/favicon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body { margin:0; padding:0; }
    .page-shell { min-height: 100vh; }
    .page-header { padding: 2rem; background: rgba(245,245,243,0.92); border-bottom: 1px solid rgba(0,0,0,0.05); }
    .page-title { font-size: 1.75rem; font-weight:700; color:#000; letter-spacing: -0.02em; margin: 0; }
    .page-subtitle { font-size: 0.95rem; color: rgba(0,0,0,0.6); margin: 0.5rem 0 0 0; font-weight: 400; }
    #map { height: calc(100vh - 180px); width: 100%; }
    .info { position: absolute; top: 220px; right: 20px; background: rgba(255,255,255,0.96); padding: 12px 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-weight: 600; font-size: 0.9rem; color: #000; border: 1px solid rgba(0,0,0,0.08); }
    .leaflet-container { background: #f5f5f3; }
  </style>
</head>
<body>
  <div class="page-shell">
    <nav class="topbar">
      <a href="#" class="brand">AdLite</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#how">How It Works</a>
        <a href="index.html#why">Why AdLite</a>
        <a href="index.html#pricing">Pricing</a>
        <a href="index.html#locations">Locations</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </nav>
    <div class="page-header">
      <h1 class="page-title">Live Distribution Network</h1>
      <p class="page-subtitle">Shop counts by area — Real-time visibility of our registered locations</p>
    </div>
    <div id="map"></div>
    <div class="info" id="total">Total shops: —</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Areas with approximate coordinates and sample shop counts
    const areas = [
      { name: 'Nakasero', lat: 0.3200, lng: 32.5850, count: 48 },
      { name: 'Ntinda', lat: 0.3560, lng: 32.6015, count: 37 },
      { name: 'Muyenga', lat: 0.3050, lng: 32.5940, count: 22 },
      { name: 'Kira', lat: 0.3640, lng: 32.6200, count: 55 },
      { name: 'Naalya', lat: 0.3610, lng: 32.6060, count: 18 },
      { name: 'Najeera', lat: 0.3700, lng: 32.5800, count: 13 }
    ];

    const center = [0.346, 32.598];
    const map = L.map('map', { zoomControl: true }).setView(center, 12);

    // Use OpenStreetMap tiles for testing (crossOrigin enabled)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
      crossOrigin: true
    }).addTo(map);

    let total = 0;
    areas.forEach(a => { total += a.count; });
    document.getElementById('total').textContent = 'Total shops: ' + total;

    areas.forEach(a => {
      const html = `<div class="count-marker" title="${a.name}">${a.count}</div>`;
      const icon = L.divIcon({ className: 'count-icon', html: html, iconSize: [36,36], iconAnchor: [18,18] });
      const marker = L.marker([a.lat, a.lng], { icon }).addTo(map);
      marker.bindPopup(`<strong>${a.name}</strong><br/>${a.count} shops registered`);
      marker.bindTooltip(`${a.name}: ${a.count}`, { permanent: true, direction: 'top', offset: [0, -20], className: 'area-tooltip' });
    });
  </script>
</body>
</html>
